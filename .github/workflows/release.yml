name: Build, Test & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Quality Checks
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Cython

      - name: Linting with Ruff
        run: ruff check .

      - name: Security Scan with Bandit
        run: bandit -r . -x ./sichern.py,./venv

      - name: Execute Tests with Pytest
        run: pytest -v

  release:
    name: Build & Publish Release Assets
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Build Script (without Cython for Runner)
        run: python build.py --no-cython

      - name: Package Distributable & Calculate Checksums
        shell: pwsh
        run: |
          $distFolder = Get-ChildItem -Directory -Filter "dist_*" | Select-Object -First 1
          if (-not $distFolder) {
            Write-Error "dist Ordner wurde nicht gefunden!"
            exit 1
          }
          $tag = "${{ github.ref_name }}"
          $zipName = "bildkomprimierung-$tag-windows-x64.zip"
          Compress-Archive -Path "$($distFolder.FullName)\*" -DestinationPath $zipName -Force

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "checksums.txt" -Encoding utf8

          Write-Output "ZIP erstellt: $zipName"
          Write-Output "SHA256: $hash"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bildkomprimierung-*.zip
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
