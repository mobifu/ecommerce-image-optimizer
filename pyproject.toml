[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "venv",
    ".git",
    "__pycache__",
    "build",
    "build_temp_*",
    "dist_*",
    "sichern.py"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^venv/",
    "^build/",
    "^build_temp_.*",
    "^dist_.*",
    "sichern\\.py$",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
