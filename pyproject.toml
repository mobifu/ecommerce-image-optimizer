[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    "venv",
    ".git",
    "__pycache__",
    "build",
    "build_temp_*",
    "dist_*",
    "sichern.py"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
